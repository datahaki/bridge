name: mvn test with JDK 25
on:
  push:
    paths:
      - '**'
jobs:
  os_matrix:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: checkout tensor
        uses: actions/checkout@v4
        with:
          repository: datahaki/tensor
          path: tensor

      - name: build and install tensor
        run: mvn install -DskipTests
        working-directory: ./tensor

      - name: checkout bridge
        uses: actions/checkout@v4
        with:
          path: bridge

      - name: mvn test
        run: xvfb-run --auto-servernum mvn test -B
        working-directory: ./bridge

